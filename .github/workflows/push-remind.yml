# Optional manual trigger only — scheduled push should run on a personal server
# with PUSH_SCHEDULER_ENABLED=true (not on Vercel).
#
# Personal server example crontab:
#   5 * * * * curl -sS -H "Authorization: Bearer $CRON_SECRET" https://your-server/api/push/send
name: Push review reminders (manual)

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call push send API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUSH_URL: ${{ vars.WORDCATCH_PUSH_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set"
            exit 1
          fi
          URL="${PUSH_URL:-https://word-catch-three.vercel.app/api/push/send}"
          echo "Note: Vercel host needs PUSH_SCHEDULER_ENABLED=true to actually send."
          code=$(curl -sS -o /tmp/push-out.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "$URL")
          echo "HTTP $code ($URL)"
          cat /tmp/push-out.json || true
          test "$code" = "200"
